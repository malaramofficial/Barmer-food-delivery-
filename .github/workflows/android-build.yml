name: Android Build

on:
  push:
    branches: [main, refactor/production-cleanup]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required configuration
        run: |
          echo "Android CI trigger verified for refactor/production-cleanup"
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "GOOGLE_WEB_CLIENT_ID is missing — Google Sign-In cannot work without the Web OAuth client ID."; exit 1; }
          case "$GOOGLE_WEB_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "GOOGLE_WEB_CLIENT_ID must be a Google OAuth Web client ID ending in .apps.googleusercontent.com"; exit 1 ;;
          esac
          test -f android/app/google-services.json || { echo "android/app/google-services.json is missing"; exit 1; }
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is missing — refusing to create an unsigned release."; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "RELEASE_STORE_PASSWORD is missing"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "RELEASE_KEY_ALIAS is missing"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "RELEASE_KEY_PASSWORD is missing"; exit 1; }
          echo "Required CI configuration is present; Firebase native config is read from google-services.json."
      - name: Restore permanent release keystore
        run: |
          # GitHub secrets can contain pasted line breaks/whitespace. Strip all
          # whitespace before decoding so a valid Base64 secret is accepted.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release-upload.jks
          chmod 600 android/app/release-upload.jks
          test -s android/app/release-upload.jks || { echo "Release keystore restore failed"; exit 1; }
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-upload.jks" >> "$GITHUB_ENV"
      - name: Verify restored keystore
        run: |
          keytool -list -keystore android/app/release-upload.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null || {
            echo "Restored keystore cannot be opened with RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS. Check the four release-signing secrets.";
            exit 1;
          }
          echo "Permanent release keystore and credentials verified."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Report signing fingerprints
        working-directory: android
        run: gradle --no-daemon signingReport
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" -PFIREBASE_API_KEY="$FIREBASE_API_KEY" -PFIREBASE_APP_ID="$FIREBASE_APP_ID" -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
      - name: Build signed release APK and AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" -PFIREBASE_API_KEY="$FIREBASE_API_KEY" -PFIREBASE_APP_ID="$FIREBASE_APP_ID" -PFIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
      - name: Verify release signatures
        run: |
          mkdir -p android/app/build/outputs/signing-report
          {
            echo "=== Debug APK ==="
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/*.apk
            echo
            echo "=== Release APK ==="
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/*.apk
            echo
            echo "=== Release AAB ==="
            jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/*.aab
          } 2>&1 | tee android/app/build/outputs/signing-report/apk-certificates.txt
      - name: Upload APK signing report
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-signing-report
          path: android/app/build/outputs/signing-report/apk-certificates.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-signed-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Remove restored release keystore
        if: always()
        run: rm -f android/app/release-upload.jks
