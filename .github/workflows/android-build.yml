name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required Supabase configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          echo "Supabase configuration is present (values are not printed)."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Build release APK and AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
