name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove legacy customer login code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/com/malaramofficial/barmerfooddelivery/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          changed = False

          # Remove the obsolete MainActivity login implementation using a
          # brace-aware scanner so the current file can be cleaned safely.
          marker = '    private void showLogin(){'
          start = text.find(marker)
          if start >= 0:
              brace = text.find('{', start)
              depth = 0
              in_string = False
              escaped = False
              end = None
              for i in range(brace, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
              if end is None:
                  raise SystemExit('Could not safely locate legacy showLogin() method')
              text = text[:start] + text[end:]
              changed = True

          # All authentication entry points now open the dedicated LoginActivity.
          text = text.replace('this::showLogin', 'this::openLogin')
          text = text.replace('showLogin();', 'openLogin();')

          if 'private void openLogin()' not in text:
              anchor = '    private void showPartner(){'
              if anchor not in text:
                  raise SystemExit('Could not locate insertion point for openLogin()')
              text = text.replace(anchor, '    private void openLogin(){startActivity(new Intent(this, LoginActivity.class));}\n\n' + anchor, 1)
              changed = True

          # These helpers existed only for the deleted legacy login form.
          legacy_import = 'import android.view.inputmethod.InputMethodManager;\n'
          if legacy_import in text:
              text = text.replace(legacy_import, '', 1)
              changed = True
          legacy_helper = '    private void hideKeyboard(){((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE)).hideSoftInputFromWindow(root.getWindowToken(),0);}\n'
          if legacy_helper in text:
              text = text.replace(legacy_helper, '', 1)
              changed = True

          path.write_text(text, encoding='utf-8')
          print('Legacy login cleanup:', 'changed' if changed else 'already clean')
          PY

          if git grep -n -E 'showLogin\(|Welcome back 👋|Login for faster checkout and order tracking\.' -- android/app/src/main/java; then
            echo 'Legacy login references remain in source.'
            exit 1
          fi

          if ! git diff --quiet -- android/app/src/main/java/com/malaramofficial/barmerfooddelivery/MainActivity.java; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add android/app/src/main/java/com/malaramofficial/barmerfooddelivery/MainActivity.java
            git commit -m 'refactor: remove obsolete MainActivity login implementation'
            git push
          fi
      - name: Validate required Supabase configuration
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is missing"; exit 1; }
          echo "Supabase configuration is present (values are not printed)."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Build release APK and AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" -PMAPS_API_KEY="$MAPS_API_KEY" -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: barmer-food-delivery-v2-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
