plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.malaramofficial.barmerfooddelivery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.malaramofficial.barmerfooddelivery'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.1.0'
        buildConfigField 'String', 'SUPABASE_URL', '"' + (project.findProperty('SUPABASE_URL') ?: System.getenv('SUPABASE_URL') ?: '') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + (project.findProperty('SUPABASE_ANON_KEY') ?: System.getenv('SUPABASE_ANON_KEY') ?: '') + '"'
        buildConfigField 'String', 'MAPS_API_KEY', '"' + (project.findProperty('MAPS_API_KEY') ?: System.getenv('MAPS_API_KEY') ?: '') + '"'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + (project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: System.getenv('GOOGLE_WEB_CLIENT_ID') ?: '282112805305-n7mfga06ubcaarpokkeso8iva4nfeorg.apps.googleusercontent.com') + '"'
        buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (project.findProperty('FIREBASE_API_KEY') ?: System.getenv('FIREBASE_API_KEY') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_APP_ID', '"' + (project.findProperty('FIREBASE_APP_ID') ?: System.getenv('FIREBASE_APP_ID') ?: '') + '"'
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + (project.findProperty('FIREBASE_PROJECT_ID') ?: System.getenv('FIREBASE_PROJECT_ID') ?: '') + '"'
    }

    buildFeatures { buildConfig true }

    dependencies {
        implementation platform('com.google.firebase:firebase-bom:34.18.0')
        implementation 'com.google.firebase:firebase-auth'
        implementation 'androidx.credentials:credentials:1.5.0'
        implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
        implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    }

    def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH') ?: project.findProperty('RELEASE_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD') ?: project.findProperty('RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS') ?: project.findProperty('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: project.findProperty('RELEASE_KEY_PASSWORD')
    def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && it.toString().trim() }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (!releaseSigningReady) {
                throw new GradleException('Release signing is not configured. Set RELEASE_KEYSTORE_PATH, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD. Refusing to produce an unsigned release build.')
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
