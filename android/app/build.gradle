plugins { id 'com.android.application' }

android {
    namespace 'com.malaramofficial.barmerfooddelivery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.malaramofficial.barmerfooddelivery'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'SUPABASE_URL', '"' + (project.findProperty('SUPABASE_URL') ?: System.getenv('SUPABASE_URL') ?: '') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + (project.findProperty('SUPABASE_ANON_KEY') ?: System.getenv('SUPABASE_ANON_KEY') ?: '') + '"'
        buildConfigField 'String', 'MAPS_API_KEY', '"' + (project.findProperty('MAPS_API_KEY') ?: System.getenv('MAPS_API_KEY') ?: '') + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
